services:
  ares:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - UVICORN_WORKERS=4
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: ares-gateway
    depends_on:
      - ares
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./nginx/ares.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
