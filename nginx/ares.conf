proxy_cache_path /var/cache/nginx/ares levels=1:2 keys_zone=ares_tile_cache:32m max_size=512m inactive=30m use_temp_path=off;
limit_req_zone $binary_remote_addr zone=ares_api_limit:10m rate=30r/s;

upstream ares_backend {
    least_conn;
    server ares:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers at the API Gateway edge
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # High-traffic 3D Street View & Globe endpoints: cached at gateway edge
    location ~ ^/api/v1/map/(terrain-grid|regional-texture|globe-texture|image-proxy) {
        limit_req zone=ares_api_limit burst=60 nodelay;
        proxy_pass http://ares_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_cache ares_tile_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Gateway-Cache $upstream_cache_status always;
    }

    # General API & Static Frontend
    location / {
        limit_req zone=ares_api_limit burst=40 nodelay;
        proxy_pass http://ares_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
